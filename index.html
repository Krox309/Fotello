<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fotello — Galeria wzorów</title>
<meta name="description" content="Przeglądaj ciepłe, ręcznie tworzone wzory i projekty Fotello. Kliknij zdjęcie, aby zobaczyć szczegóły." />
<meta property="og:title" content="Fotello — Galeria wzorów" />
<meta property="og:description" content="Przeglądaj ciepłe, ręcznie tworzone wzory i projekty Fotello." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>
  
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <img src="images/fotello-logo.png" alt="Fotello" width="40" height="40" />
        <span class="brand-name">Fotello</span>
      </div>
      <span class="header-tag">Galeria wzorów</span>
    </div>
  </header>

  <main>
    <section class="wrap banner-wrap">
      <div class="banner">
        <img src="images/fotello-banner.png" alt="Fotello — rękodzieła" />
      </div>
    </section>

    <section class="wrap intro">
      <h1>Galeria wzorów i projektów</h1>
      <p>Kliknij dowolną kartę, aby otworzyć widok szczegółów</p>
    </section>

    <section class="wrap">
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span class="brand-name small">Fotello</span>
      <span class="header-tag">Wykonane wzory</span>
    </div>
  </footer>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="modal-layer" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-panel">
      <div class="modal-image"><img id="modal-img" src="" alt="" /></div>
      <div class="modal-body">
        <h2 id="modal-title"></h2>
        <p class="modal-creator" id="modal-creator"></p>
        <p class="modal-desc" id="modal-desc"></p>
        <div class="modal-foot">
          <span class="header-tag" id="modal-number"></span>
          <button type="button" class="close-btn" id="close-btn">Zamknij</button>
        </div>
      </div>
    </div>
  </div>

  <script src="projects.js"></script>
  <script src="app.js"></script>
</body>
</html>
